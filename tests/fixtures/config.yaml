# Config used by the CLI tests. Owned by the test suite, deliberately separate
# from the config.yaml a user edits — tests must not break when someone changes
# their anchor city, and must never depend on a real account's settings.

account:
  profile_dir: chrome-profile

location:
  anchor: "Springfield, IL"
  radius_miles: 250

schedule:
  active_hours: "07:00-22:00"

extraction:
  model: claude-opus-5
  effort: low
  max_extractions_per_run: 25

notifications:
  enabled: false
  email:
    to: you@example.com
    from: marketsearch@example.com
    smtp_host: smtp.example.com
    smtp_port: 587
    username: marketsearch@example.com
    password_env: MARKETSEARCH_SMTP_PASSWORD
  sms:
    to: "+15555550100"
    twilio_from: "+15555550101"
    account_sid_env: TWILIO_ACCOUNT_SID
    auth_token_env: TWILIO_AUTH_TOKEN

watchlists:
  - name: track-loaders
    exclude: ["wanted", "parts only"]
    on_unknown: alert
    criteria: |
      Under 3000 engine hours.
      Reject anything describing major engine or hydraulic problems.
    queries:
      - "Bobcat T770"
    models:
      - {name: bobcat-t770, keywords: ["t770"], price: {min: 15000, max: 50000}}
