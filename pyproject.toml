[project]
name = "marketsearch"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "playwright>=1.44",
    "anthropic>=0.40",
    "jinja2>=3.1",
    "twilio>=9.0",
    "typer>=0.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-mock>=3.14"]

[project.scripts]
marketsearch = "marketsearch.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marketsearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live_api: hits the real Anthropic API (costs money)",
    "live_fb: hits real Facebook (detection risk)",
]
addopts = "-m 'not live_api and not live_fb'"
